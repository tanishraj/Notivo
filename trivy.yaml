# Settings for `npm run scan:trivy` and `npm run scan:image`, which CI runs too.
severity: [HIGH, CRITICAL]
exit-code: 1
vulnerability:
  ignore-unfixed: true
scan:
  scanners: [vuln, secret, misconfig]
  skip-dirs: [node_modules, build, data, output, tmp, coverage, portal/dist]
  # Local secret files are gitignored and never committed.
  skip-files: [.dev.vars, .dev.vars.*, .env, .env.*]
